spring:
  application:
    name: kommikku-source-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  cache:
    type: simple

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

firebase:
  enabled: false
  project-id: ""
  storage-bucket: ""
  credentials-path: ""

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
